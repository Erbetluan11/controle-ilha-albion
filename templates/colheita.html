{% extends "base.html" %}

{% block conteudo %}
<div class="card">
    <h2>Registrar colheita</h2>
    <p><strong>{{ plantio['nome'] }}</strong> — {{ plantio['quantidade'] }} sementes</p>

    <form method="post">
        <label>Quantidade colhida</label>
        <input type="number" name="colhido" min="0" required>

        <label>Preço de venda por unidade</label>
        <input type="number" step="0.01" name="preco_unitario" required>

        <button type="submit">Salvar colheita</button>
    </form>
</div>
{% endblock %}
