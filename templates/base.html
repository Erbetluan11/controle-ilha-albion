<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle da Ilha - Albion</title>
    <style>
        body { font-family: Arial, sans-serif; background: #12141c; color: #e8e8e8; margin: 0; }
        header { background: #1b1f2b; padding: 18px; display: flex; gap: 20px; align-items: center; }
        header h1 { margin: 0; font-size: 20px; color: #ffd35c; }
        nav a { color: #cfd6ff; text-decoration: none; margin-right: 14px; }
        nav a:hover { color: #ffd35c; }
        main { padding: 24px; max-width: 1100px; margin: auto; }
        table { width: 100%; border-collapse: collapse; background: #1b1f2b; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #2b3040; text-align: left; }
        th { background: #232838; color: #ffd35c; }
        .card { background: #1b1f2b; padding: 18px; border-radius: 12px; margin-bottom: 20px; }
        .positivo { color: #6ee787; font-weight: bold; }
        .negativo { color: #ff7b72; font-weight: bold; }
        input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #39415a; background: #232838; color: #fff; }
        button { background: #ffd35c; color: #12141c; font-weight: bold; cursor: pointer; border: none; }
        form { display: grid; gap: 12px; max-width: 500px; }
    </style>
</head>
<body>
    <header>
        <h1>Controle da Ilha</h1>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('novo') }}">Novo plantio</a>
            <a href="{{ url_for('precos') }}">Melhores preços</a>
        </nav>
    </header>
    <main>
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
