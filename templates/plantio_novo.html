{% extends "base.html" %}

{% block conteudo %}
<div class="card">
    <h2>Novo plantio</h2>

    <form method="post">
        <label>Planta</label>
        <select name="nome" id="planta" required>
            {% for p in plantas %}
            <option value="{{ p.nome }}" data-semente="{{ p.seed }}">{{ p.nome }}</option>
            {% endfor %}
        </select>

        <label>ID da semente</label>
        <input type="text" name="semente" id="semente" required>

        <label>Quantidade de sementes</label>
        <input type="number" name="quantidade" min="1" required>

        <label>Custo por semente</label>
        <input type="number" step="0.01" name="custo_unitario" required>

        <label>Cidade</label>
        <select name="cidade" required>
            {% for c in cidades %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <button type="submit">Salvar plantio</button>
    </form>
</div>

<script>
    const plantas = {{ plantas|tojson }};
    const select = document.getElementById("planta");
    const campo = document.getElementById("semente");

    function atualizar() {
        const escolhida = plantas.find(p => p.nome === select.value);
        campo.value = escolhida.seed;
    }

    select.addEventListener("change", atualizar);
    atualizar();
</script>
{% endblock %}
